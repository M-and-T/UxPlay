name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            zlib:x64-windows `
            libplist:x64-windows `
            glib:x64-windows `
            mdnsresponder:x64-windows `
            pthreads:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad]:x64-windows

      - name: Create compatibility header for MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "msvc_compat"
          $compat_code = @"
          #ifndef MSVC_COMPAT_UNISTD_H
          #define MSVC_COMPAT_UNISTD_H
          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif
          #include <windows.h>
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <stdint.h>
          #include <time.h>
          #define CLOCK_REALTIME 0
          static int clock_gettime(int clk_id, struct timespec *tp) {
              uint64_t ticks = GetTickCount64();
              tp->tv_sec = ticks / 1000;
              tp->tv_nsec = (ticks % 1000) * 1000000;
              return 0;
          }
          #define SOL_TCP IPPROTO_TCP
          #define strdup _strdup
          #endif
          "@
          $compat_code | Out-File -FilePath "msvc_compat/unistd.h" -Encoding ascii
          $AbsPath = $((Get-Item "msvc_compat").FullName)
          echo "MSVC_COMPAT_PATH=$AbsPath" >> $env:GITHUB_ENV

      - name: Patch source code for MSVC
        shell: pwsh
        run: |
          # 1. snprintf の二重定義を無効化
          Get-ChildItem -Recurse -Include *.h, *.c | ForEach-Object {
            (Get-Content $_.FullName) -replace '#define snprintf', '// #define snprintf' | Set-Content $_.FullName
          }

          # 2. thread_handle_t 関連の型変換エラー対策
          $thread_files = @("lib/httpd.c", "lib/raop_ntp.c", "lib/raop_rtp.c", "lib/raop_rtp_mirror.c")
          foreach ($f in $thread_files) {
            if (Test-Path $f) {
              (Get-Content $f) -replace '([a-zA-Z0-9_]+_handle)\s*=\s*0;', '$1 = {0};' | Set-Content $f
            }
          }

          # 3. dnssd.c が vcpkg の dns_sd.h を使うように修正 (独自定義との衝突回避)
          $dnssd_c = "lib/dnssd.c"
          if (Test-Path $dnssd_c) {
            (Get-Content $dnssd_c) -replace '#include "dnssd.h"', '#include <dns_sd.h>' | Set-Content $dnssd_c
          }

          # 4. plist_mem_free の二重定義修正
          if (Test-Path "lib/raop.c") {
            (Get-Content lib/raop.c) -replace 'void\s+plist_mem_free', '// void plist_mem_free' | Set-Content lib/raop.c
          }

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DNO_AIRPLAY_ADVT=OFF `
            -DCMAKE_C_FLAGS="/I`"$env:MSVC_COMPAT_PATH`" /DWIN32 /D_WINDOWS /DWIN32_LEAN_AND_MEAN /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /permissive /wd4005 /wd4142 /wd4710 /wd4711 /wd5045 /wd4820 /wd4255 /wd4100 /wd4267 /wd4244 /wd4242" `
            -DCMAKE_EXE_LINKER_FLAGS="ws2_32.lib winmm.lib iphlpapi.lib crypt32.lib dnssd.lib"

      - name: Build
        run: |
          cmake --build build --config Release --parallel -- /v:m /p:WarningLevel=0

      - name: Prepare Artifact
        shell: pwsh
        run: |
          if (!(Test-Path "output")) { New-Item -ItemType Directory -Path "output" }
          if (Test-Path "build\Release\uxplay.exe") {
              Copy-Item "build\Release\uxplay.exe" -Destination "output\"
          }
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" | Copy-Item -Destination "output\" -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-x64
          path: output/