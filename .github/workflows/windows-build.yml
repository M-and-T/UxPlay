name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            zlib:x64-windows `
            libplist:x64-windows `
            glib:x64-windows `
            mdnsresponder:x64-windows `
            pthreads:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad]:x64-windows

      - name: Create compatibility header for MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "msvc_compat"
          # unistd.h の中身に Windows 用の定義を書き込む
          $compat_code = @"
          #ifndef MSVC_COMPAT_UNISTD_H
          #define MSVC_COMPAT_UNISTD_H
          #include <windows.h>
          #include <winsock2.h>
          #include <ws2tcpip.h>
          #include <stdint.h>

          /* 時間計測用の定義 */
          #define CLOCK_REALTIME 0
          static int clock_gettime(int clk_id, struct timespec *tp) {
              uint64_t ticks = GetTickCount64();
              tp->tv_sec = ticks / 1000;
              tp->tv_nsec = (ticks % 1000) * 1000000;
              return 0;
          }

          /* ネットワーク定数の変換 */
          #define SOL_TCP IPPROTO_TCP

          /* POSIX関数の別名 */
          #define strdup _strdup

          #endif
          "@
          $compat_code | Out-File -FilePath "msvc_compat/unistd.h" -Encoding ascii
          
          $AbsPath = $((Get-Item "msvc_compat").FullName)
          echo "MSVC_COMPAT_PATH=$AbsPath" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          # 絶対パスを使ってインクルードを通し、必要なライブラリをリンク
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DNO_AIRPLAY_ADVT=OFF `
            -DCMAKE_C_FLAGS="/I`"$env:MSVC_COMPAT_PATH`" /DWIN32 /D_WINDOWS /D_CRT_SECURE_NO_WARNINGS /wd4710 /wd4711 /wd5045 /wd4820 /wd4255 /wd4242 /wd4244 /wd4267 /wd4100" `
            -DCMAKE_EXE_LINKER_FLAGS="ws2_32.lib winmm.lib iphlpapi.lib"

      - name: Build
        run: |
          cmake --build build --config Release --parallel -- /v:m /p:WarningLevel=0

      - name: Prepare Artifact
        shell: pwsh
        run: |
          if (!(Test-Path "output")) { New-Item -ItemType Directory -Path "output" }
          if (Test-Path "build\Release\uxplay.exe") {
              Copy-Item "build\Release\uxplay.exe" -Destination "output\"
          }
          # 実行に必要なDLL類を収集
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" | Copy-Item -Destination "output\" -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-x64
          path: output/