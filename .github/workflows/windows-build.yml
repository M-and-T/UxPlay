name: Build UxPlay for Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libplist
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            git

      - name: Build UxPlay
        run: |
          mkdir build
          cd build
          # MSYS2(MinGW)では "MinGW Makefiles" を指定するのが確実です
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          # make ではなく mingw32-make を使用します
          mingw32-make -j$(nproc)

      - name: Prepare Artifact
        run: |
          mkdir output
          cp build/uxplay.exe output/
          # 実行に必要な最小限のDLLを収集（lddを使って依存DLLをコピーするスクリプト）
          for dll in $(ldd build/uxplay.exe | grep "mingw64" | awk '{print $3}'); do
            cp "$dll" output/
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-MSYS2
          path: output/