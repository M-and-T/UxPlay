name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            zlib:x64-windows `
            libplist:x64-windows `
            glib:x64-windows `
            mdnsresponder:x64-windows `
            pthreads:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad]:x64-windows

      - name: Create compatibility header for MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "msvc_compat"
          $compat_code = @"
          #ifndef MSVC_COMPAT_H
          #define MSVC_COMPAT_H

          #ifndef WIN32_LEAN_AND_MEAN
          #define WIN32_LEAN_AND_MEAN
          #endif

          /* 基本的な型定義 */
          #include <stdint.h>
          #include <io.h>
          #include <process.h>

          /* POSIX missing macros */
          #define CLOCK_REALTIME 0
          #define SOL_TCP 6  /* IPPROTO_TCP */
          #define strdup _strdup

          /* ssize_t definition */
          #ifndef _SSIZE_T_DEFINED
          #define _SSIZE_T_DEFINED
          #ifdef _WIN64
          typedef __int64 ssize_t;
          #else
          typedef int ssize_t;
          #endif
          #endif

          /* Avoid dnssd.h conflicts */
          #define _TXTRecordRef_t_defined
          #endif
          "@
          $compat_code | Out-File -FilePath "msvc_compat/unistd.h" -Encoding ascii
          $AbsPath = $((Get-Item "msvc_compat").FullName)
          echo "MSVC_COMPAT_PATH=$AbsPath" >> $env:GITHUB_ENV
          echo "MSVC_COMPAT_PATH=$AbsPath" >> $env:GITHUB_ENV

      - name: Patch source code for MSVC
        shell: pwsh
        run: |
          # 1. snprintf の二重定義を無効化
          Get-ChildItem -Recurse -Include *.h, *.c | ForEach-Object {
            (Get-Content $_.FullName) -replace '#define snprintf', '// #define snprintf' | Set-Content $_.FullName
          }

          # 2. plist_mem_free の二重定義修正
          if (Test-Path "lib/raop.c") {
            (Get-Content lib/raop.c) -replace 'void\s+plist_mem_free', '// void plist_mem_free' | Set-Content lib/raop.c
          }

          # 3. thread_handle_t の問題は CFLAGS で対処するため、ここでは何もしない

      - name: Configure CMake
        run: |
          $CompatPath = $env:MSVC_COMPAT_PATH
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DNO_AIRPLAY_ADVT=OFF `
            -DCMAKE_C_FLAGS="/I $CompatPath /DWIN32 /D_WINDOWS /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /Dthread_handle_t=HANDLE /DDNSServiceRef=void* /Ddnssd_t=void /permissive /wd4005 /wd4431 /wd4013" `
            -DCMAKE_EXE_LINKER_FLAGS="ws2_32.lib winmm.lib iphlpapi.lib crypt32.lib"

      - name: Build
        run: |
          cmake --build build --config Release --parallel -- /v:m /p:WarningLevel=0

      - name: Prepare Artifact
        shell: pwsh
        run: |
          if (!(Test-Path "output")) { New-Item -ItemType Directory -Path "output" }
          if (Test-Path "build\Release\uxplay.exe") {
              Copy-Item "build\Release\uxplay.exe" -Destination "output\"
          }
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" | Copy-Item -Destination "output\" -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-x64
          path: output/