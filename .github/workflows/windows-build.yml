name: Build UxPlay for Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libplist
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            git

      - name: Build UxPlay
        run: |
          # 1. CMakeのチェックを回避
          sed -i 's/if ( NOT APPLE )/if ( NOT APPLE AND NOT NO_AIRPLAY_ADVERT )/' lib/CMakeLists.txt
          sed -i 's/FATAL_ERROR/STATUS/g' lib/CMakeLists.txt
          
          # 2. リンカーを騙すための「空の関数（スタブ）」を作成
          # 他のファイルから呼び出される名前だけを定義し、中身を空にします
          cat <<EOF > lib/dnssd.c
          #include <stdint.h>
          void dnssd_init() {}
          void dnssd_register_raop() {}
          void dnssd_unregister_raop() {}
          void dnssd_register_airplay() {}
          void dnssd_unregister_airplay() {}
          void dnssd_destroy() {}
          void dnssd_set_airplay_features() {}
          uint64_t dnssd_get_airplay_features() { return 0; }
          void* dnssd_get_hw_addr() { return 0; }
          void* dnssd_get_airplay_txt() { return 0; }
          void* dnssd_get_raop_txt() { return 0; }
          const char* dnssd_get_name() { return "UxPlay"; }
          void dnssd_set_pk() {}
          EOF

          mkdir build
          cd build
          # 3. ビルド実行
          cmake .. -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_AIRPLAY_ADVERT=ON \
            -DNO_MARCH_NATIVE=ON
          
          mingw32-make -j$(nproc)

      - name: Prepare Artifact
        run: |
          mkdir output
          cp build/uxplay.exe output/
          
          # 1. uxplay.exe が直接必要とする DLL を収集
          for dll in $(ldd build/uxplay.exe | grep "mingw64" | awk '{print $3}'); do
            cp "$dll" output/
          done

          # 2. GStreamerプラグイン本体をコピー
          mkdir -p output/lib/gstreamer-1.0
          cp /mingw64/lib/gstreamer-1.0/*.dll output/lib/gstreamer-1.0/

          # 3. 【重要】プラグインが依存する「すべてのDLL」を力技で収集
          # フォルダ内の全プラグインに対して ldd をかけ、重複なしで bin からコピーします
          echo "Collecting plugin dependencies..."
          for plugin in output/lib/gstreamer-1.0/*.dll; do
            for dll in $(ldd "$plugin" | grep "mingw64" | awk '{print $3}'); do
              cp -n "$dll" output/ 2>/dev/null || true
            done
          done

          # 4. 起動用バッチファイル（PATHをその場に限定して通す設定）
          echo '@echo off' > output/run_uxplay.bat
          echo 'set PATH=%~dp0;%PATH%' >> output/run_uxplay.bat
          echo 'set GST_PLUGIN_PATH=%~dp0lib\gstreamer-1.0' >> output/run_uxplay.bat
          echo 'uxplay.exe %*' >> output/run_uxplay.bat
          echo 'pause' >> output/run_uxplay.bat

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-MSYS2
          path: output/