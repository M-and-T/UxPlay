name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # vcpkg を使って依存関係をインストール
      # gstreamer は plugins-base, plugins-good, plugins-bad, openssl の各機能を含めてインストールします
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad,openssl]:x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # 成果物を整理してアップロード
      - name: Prepare Artifact
        run: |
          mkdir output
          copy build\Release\uxplay.exe output\
          # DLLも同梱したい場合は、vcpkg のバイナリをコピーする処理が必要になる場合があります

      - name: Upload Artifact
          uses: actions/upload-artifact@v4
          with:
            name: UxPlay-Windows-x64
            path: output/