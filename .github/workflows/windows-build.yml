name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad,openssl]:x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          if (Test-Path "build\Release\uxplay.exe") {
              Copy-Item "build\Release\uxplay.exe" -Destination "output\"
          }
          # DLLも同梱したい場合はここでさらにコピー処理を追加可能です

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-x64
          path: output/