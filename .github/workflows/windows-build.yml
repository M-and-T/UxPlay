name: Build UxPlay for Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install `
            openssl:x64-windows `
            gstreamer[core,plugins-base,plugins-good,plugins-bad]:x64-windows

      - name: Configure CMake
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifact (Collect EXE and DLLs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          # 実行ファイルをコピー
          if (Test-Path "build\Release\uxplay.exe") {
              Copy-Item "build\Release\uxplay.exe" -Destination "output\"
          }
          # vcpkgでビルドされた依存DLLを自動収集してoutputフォルダへ（これがないと他PCで動きません）
          Get-ChildItem -Path "build\Release\*.dll" -Recurse | Copy-Item -Destination "output\" -ErrorAction SilentlyContinue
          # vcpkg のインストールディレクトリにある bin からも DLL を収集
          Get-ChildItem -Path "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" | Copy-Item -Destination "output\" -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows-x64-Full
          path: output/