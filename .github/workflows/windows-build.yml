name: Windows Build UxPlay

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CMake と Ninja をインストール（最新安定）
      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      # GStreamer を Chocolatey 経由でインストール
      - name: Install GStreamer
        run: |
          choco install gstreamer --version=1.22.0 -y
          # パスを通す
          setx PATH "%PATH%;C:\gstreamer\1.0\x86_64"

      # ビルド用ディレクトリ作成
      - name: Create build directory
        run: mkdir build

      # CMake でプロジェクト構成
      - name: Configure with CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:/gstreamer/1.0/x86_64"

      # 実際のビルド
      - name: Build
        run: cmake --build build --config Release --target ALL_BUILD

      # 成果物をアーティファクトとしてアップロード
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UxPlay-Windows
          path: build/Release/*
